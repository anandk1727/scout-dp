<div class="flex flex-col items-center justify-center min-h-[50vh] h-full p-6 text-center">
  <i class="pi pi-exclamation-triangle text-4xl! text-red-600"></i>

  <h2 class="text-lg font-semibold text-primary-600 mb-2">Oops! Something went wrong</h2>
  <p class="text-primary-400 mb-6 max-w-md">
    {{ message() }}
  </p>

  <button
    (click)="onRetry()"
    class="flex items-center gap-2 px-5 py-2.5 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
  >
    <i class="pi pi-refresh"></i>
    Try Again
  </button>
</div>
