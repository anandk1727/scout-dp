<div>
  @if (store.status() === 'error') {
    <app-error-screen (retry)="store.load()" />
  } @else {
    <h1 class="font-semibold text-primary-700 md:text-xl">Near Earth objects</h1>
    <div class="flex justify-between py-4">
      <input
        pInputText
        type="search"
        placeholder="Search objects…"
        aria-label="Search objects"
        [value]="quickFilter()"
        (input)="quickFilter.set($any($event.target).value)"
        [attr.aria-busy]="store.isLoading()"
      />

      <button pButton [disabled]="store.isLoading()" (click)="store.load()">
        @if (store.isLoading()) {
          Loading...
        } @else {
          Refresh
        }
      </button>
    </div>

    <ag-grid-angular
      aria-label="Near-Earth objects data table"
      [rowData]="store.objects()"
      class="h-[70vh]"
      [loading]="store.isLoading()"
      [getRowId]="getRowId"
      [columnDefs]="colDefs"
      [theme]="theme"
      [defaultColDef]="defaultColDef"
      [quickFilterText]="quickFilter()"
      (rowClicked)="onRowClicked($event)"
      (cellKeyDown)="onCellKeyDown($event)"
    />

    @if (store.selected(); as obj) {
      <p-dialog
        [header]="`Object - ${store.selected()?.designation}`"
        [modal]="true"
        [visible]="!!store.selected()"
        styleClass="w-[90vw] md:w-[60vw]"
        (visibleChange)="store.select(null)"
      >
        <dl class="grid grid-cols-2 gap-x-4 gap-y-2 max-h-[500px] pb-4!">
          @for (entry of store.selected() | keyvalue; track entry.key) {
            <dt class="text-muted-color">{{ entry.key }}</dt>
            <dd>{{ entry.value ?? '—' }}</dd>
          }
        </dl>
      </p-dialog>
    }
  }
</div>
